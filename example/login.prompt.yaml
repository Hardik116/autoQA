name: User login and create item
tags: auth, smoke

--- login page ---
navigate: /login
waitForSec: 10
fill: store name / email field >> selenium_store
fill: the password field >> rAw-password1
click: the submit button
waitFor: loading complete snackbar to appear
verify: store name should be selenium_store on top left corner

--- dashboard ---
# page already changed after login — no navigate needed
